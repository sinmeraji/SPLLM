<!doctype html>
<!--
  File: static/index.html
  Purpose: Minimal UI to explore data, call LLM decisions, and execute proposals.
  Note: Decide (LLM) now sends the entire universe of tickers to the backend,
        not just the single selected ticker.
        UI refreshed with a top status bar and improved layout/colors.
-->
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPLLM Mock UI</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --line: #e2e8f0;
      --accent: #2563eb;
      --accent-2: #10b981;
      --warn: #f59e0b;
    }
    body {
      font-family: -apple-system, system-ui, Arial;
      margin: 0;
      padding: 0 16px 24px 16px;
      background: var(--bg);
      color: var(--text);
    }
    h1 { margin: 16px 0 8px 0; font-size: 20px; color: var(--text); }
    .statusbar {
      position: sticky; top: 0; z-index: 10;
      background: rgba(255,255,255,0.9);
      backdrop-filter: saturate(180%) blur(6px);
      border-bottom: 1px solid var(--line);
      padding: 8px 0;
      margin: 0 -16px 12px -16px; padding-left: 16px; padding-right: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; }
    .row { display: flex; gap: 16px; align-items: stretch; }
    .col { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04); }
    label { display:block; margin-top:8px; color: var(--muted); font-size: 13px; }
    select, input[type="date"], input[type="number"] { width: 100%; max-width: 280px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
    button { display:inline-block; margin-top:8px; padding: 8px 12px; border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 8px; cursor: pointer; transition: all .15s ease; }
    button:hover { background: #f1f5f9; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary:hover { filter: brightness(0.95); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    h3 { margin: 4px 0 8px 0; padding-bottom: 6px; border-bottom: 1px solid var(--line); color: var(--muted); font-weight: 600; font-size: 14px; }
    pre { background:#f1f5f9; padding:8px; border-radius: 8px; border: 1px solid var(--line); }
    #events { max-height: 260px; overflow: auto; }
    #portfolio { max-height: 220px; overflow: auto; }
    #orderResult { max-height: 160px; overflow: auto; }
    #coverage { font:12px monospace; color:#64748b; }
    #livePrice { color: var(--text); }
    canvas { background: #fff; border: 1px solid var(--line); border-radius: 8px; }
    /* Recommendation list styling */
    #recs > div { border-bottom: 1px dashed var(--line); padding: 6px 2px; display: flex; align-items: flex-start; gap: 8px; }
    #recs > div:last-child { border-bottom: 0; }
    #recs label { margin: 0; color: var(--text); font-size: 14px; }
    .rec-ticker { font-weight: 600; color: var(--accent); }
    .rec-action { font-weight: 600; color: var(--accent-2); margin-left: 4px; }
    .rec-action.sell { color: #ef4444; }
    .rec-thesis { display:block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  </style>
</head>
<body>
  <h1>SPLLM Mock UI</h1>
  <div class="statusbar">
    <span class="dot" id="statusDot"></span>
    <div id="status">Ready</div>
  </div>
  <div class="row">
    <div class="col">
      <h3>Universe</h3>
      <select id="ticker"></select>
      <label>Start <input type="date" id="start" /></label>
      <label>End <input type="date" id="end" /></label>
      <button id="load">Load</button>
      <button id="decide" class="primary">Decide (LLM)</button>
      <canvas id="chart" height="140"></canvas>
      <div id="coverage" style="margin-top:8px;font:12px monospace;color:#555"></div>
    </div>
    <div class="col">
      <h3>Portfolio</h3>
      <button id="refresh">Refresh</button>
      <div id="portfolioSummary" style="margin:6px 0;font:14px/1.4 -apple-system, system-ui, Arial"></div>
      <pre id="portfolio"></pre>
      <h3>Place Order</h3>
      <label>Ticker
        <select id="orderTicker"></select>
      </label>
      <div id="livePrice" style="margin:4px 0;color:#333;font:13px -apple-system, system-ui, Arial">Price: -</div>
      <label>Side
        <select id="side"><option>BUY</option><option>SELL</option></select>
      </label>
      <label>Quantity <input id="qty" type="number" step="0.01" value="1"/></label>
      <button id="submit" class="primary">Submit</button>
      <pre id="orderResult"></pre>
    </div>
  </div>
  <div class="row">
    <div class="col" style="flex: 1 1 100%">
      <h3>Recommendations</h3>
      <div id="recs"></div>
      <button id="execSelected" class="primary" disabled>Execute Selected</button>
    </div>
  </div>
  <div class="row">
    <div class="col" style="flex: 1 1 100%"><h3>Events</h3><pre id="events"></pre></div>
  </div>

  <script>
    // Basic diagnostics to surface errors in the UI
    try { document.getElementById('status').textContent = 'UI loaded'; } catch {}
    // Auto-clear events panel on load
    try { document.getElementById('events').textContent = ''; } catch {}
    window.addEventListener('error', (e)=>{
      const el = document.getElementById('status');
      if (el) el.textContent = `JS error: ${e.message || e}`;
    });
    window.addEventListener('unhandledrejection', (e)=>{
      const el = document.getElementById('status');
      if (el) el.textContent = `Promise error: ${e.reason && e.reason.message ? e.reason.message : e.reason}`;
    });
    const api = async (p, opts={})=> {
      const { timeoutMs } = opts || {};
      const ctrl = typeof AbortController !== 'undefined' && timeoutMs ? new AbortController() : null;
      const t = timeoutMs && ctrl ? setTimeout(()=> ctrl.abort(), timeoutMs) : null;
      console.debug('[UI] fetch', p);
      const r = await fetch(p, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined });
      if (t) clearTimeout(t);
      if (!r.ok) { throw new Error(await r.text()); }
      return r.json();
    };

    async function loadUniverse(){
      const u = await api('/universe');
      const sel = document.getElementById('ticker');
      sel.innerHTML = '';
      u.tickers.forEach(t=>{ const o=document.createElement('option'); o.text=t; o.value=t; sel.add(o); });
      if(u.tickers.length){ sel.value=u.tickers[0]; }
      try { window._universeTickers = Array.isArray(u.tickers) ? u.tickers.slice() : []; } catch {}
      // Populate order ticker list
      const oSel = document.getElementById('orderTicker');
      oSel.innerHTML = '';
      (window._universeTickers || []).forEach(t=>{ const o=document.createElement('option'); o.text=t; o.value=t; oSel.add(o); });
      if (window._universeTickers && window._universeTickers.length){ oSel.value = window._universeTickers[0]; }
      updateLivePrice();
    }

    let chart;
    async function loadBars(){
      console.debug('[UI] loadBars invoked');
      const status = document.getElementById('status');
      const t = document.getElementById('ticker').value;
      const start = document.getElementById('start').value;
      const end = document.getElementById('end').value;
      const rangeLabel = (start && end) ? `${start}..${end}` : '';
      if(!start || !end){ status.textContent = "Pick both Start and End dates"; console.warn('[UI] missing dates', {start,end}); return; }
      status.textContent = `Loading ${t} ${rangeLabel}...`;
      try {
        const url = `/prices/range/${t}?start=${start}&end=${end}`;
        console.debug('[UI] GET', url);
        const data = await api(url);
        if (!data.bars || data.bars.length === 0){
          if (chart) { chart.destroy(); chart = undefined; }
          status.textContent = `No data for ${t} ${rangeLabel}`.trim();
          console.info('[UI] no bars', {ticker:t, start, end});
          return;
        }
        const raw = data.bars.map(b=> ({ x: new Date(b.ts), y: b.close }));
        const startDate = new Date(start);
        const endDate = new Date(end);
        const diffMs = endDate - startDate;
        const diffDays = Math.max(1, Math.round(diffMs / 86400000) + 1);

        function chooseBucket(days){
          if (days <= 1) return { bucketMs: 15*60*1000, unit: 'minute' }; // 15m
          if (days <= 7) return { bucketMs: 60*60*1000, unit: 'hour' };   // 1h
          if (days <= 30) return { bucketMs: 2*60*60*1000, unit: 'hour' }; // 2h
          if (days <= 120) return { bucketMs: 24*60*60*1000, unit: 'day' }; // 1d
          return { bucketMs: 24*60*60*1000, unit: 'day' }; // 1d for longer
        }
        const { bucketMs, unit } = chooseBucket(diffDays);

        // Resample by bucket: use last close per bucket for a clean trend
        const bucketToPoint = new Map();
        for (const p of raw){
          const key = Math.floor(p.x.getTime() / bucketMs) * bucketMs;
          bucketToPoint.set(key, p); // overwrite keeps the last close in bucket
        }
        const points = Array.from(bucketToPoint.keys()).sort((a,b)=>a-b).map(k=>({ x: new Date(k), y: bucketToPoint.get(k).y }));
        const ctx = document.getElementById('chart').getContext('2d');
        if(chart) { chart.destroy(); }
        chart = new Chart(ctx, {
          type:'line',
          data:{ datasets:[{ label: `${t} ${rangeLabel}`.trim(), data: points, borderColor:'#2b6', borderWidth:1.5, fill:false, pointRadius: 0, spanGaps: false, cubicInterpolationMode: 'monotone' }] },
          options:{
            animation:false,
            plugins:{ decimation:{ enabled:true, algorithm:'lttb', samples: 1000 } },
            scales:{
              x:{ type:'time', time:{ unit, displayFormats:{ minute:'HH:mm', hour:'HH:mm', day:'MMM d' } }, ticks:{ maxRotation:0, autoSkip:true, maxTicksLimit: 12 } },
              y:{ beginAtZero:false }
            }
          }
        });
        status.textContent = `Loaded ${t} ${rangeLabel} — bars: ${data.bars.length}`.trim();
        console.debug('[UI] loaded bars', {ticker:t, count:data.bars.length});
      } catch (e) {
        status.textContent = `Error loading ${t} ${rangeLabel}: ${e}`.trim();
        console.error('[UI] loadBars error', e);
      }
    }

    async function refreshPortfolio(){
      const simple = await api('/portfolio');
      document.getElementById('portfolio').textContent = JSON.stringify(simple, null, 2);
      try {
        // First, refresh provider prices for held tickers and upsert into DB
        try { await fetch('/portfolio/refresh-prices', { method:'POST' }); } catch {}
        const s = await api('/portfolio/summary');
        const el = document.getElementById('portfolioSummary');
        const rows = s.positions.map(p=> `${p.ticker}: qty=${p.quantity} avg=${p.avg_cost} price=${p.price ?? '-'} value=${p.value} pnl=${p.pnl} (${p.pnl_pct}%) weight=${p.weight_pct}%`);
        el.textContent = `Equity $${s.equity} | Cash $${s.cash} | Positions ${s.positions_count}\n` + rows.join('\n');
      } catch {}
    }

    async function updateLivePrice(){
      const t = document.getElementById('orderTicker').value;
      try{
        const j = await api(`/prices/latest/${t}`);
        document.getElementById('livePrice').textContent = `Price: ${j.price !== null ? `$${j.price.toFixed(2)}` : '-'}`;
        return j.price;
      } catch(e){
        document.getElementById('livePrice').textContent = 'Price: -';
        return null;
      }
    }

    let _orderSubmitting = false;
    async function submitOrder(){
      if (_orderSubmitting) { console.debug('[UI] submit ignored: already submitting'); return; }
      _orderSubmitting = true;
      const submitBtn = document.getElementById('submit');
      if (submitBtn) submitBtn.disabled = true;
      const ts = new Date().toISOString();
      const ticker = document.getElementById('orderTicker').value;
      const side = document.getElementById('side').value;
      const quantity = parseFloat(document.getElementById('qty').value);
      const live = await updateLivePrice();
      const price = (live !== null && !Number.isNaN(live)) ? live : 100.0;
      try{
        // 1) Preview
        const previewRes = await fetch('/orders/preview', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ticker, side, quantity, price })});
        const preview = await previewRes.json();
        const warn = (preview.reasons && preview.reasons.length) ? (`\nWarnings: ${preview.reasons.map(r=>`${r}${preview.reason_descriptions&&preview.reason_descriptions[r]?` — ${preview.reason_descriptions[r]}`:''}`).join('\n          ')}`) : '';
        const summary = `About to ${side} ${quantity} ${ticker} at ~$${price.toFixed(2)} (notional $${preview.notional})` +
                        `\nCash before: $${preview.cash_before}  -> after: $${preview.cash_after}` +
                        `\nCap value: $${preview.cap_value}  Existing value: $${preview.existing_value}` +
                        `\nMin order: $${preview.min_order_usd}  Min cash pct: ${(preview.min_cash_pct*100).toFixed(1)}%` + warn +
                        `\n\nProceed?`;
        let ok = window.confirm(summary);
        if(!ok){ document.getElementById('orderResult').textContent = 'Cancelled.'; return; }
        if (!preview.accepted){
          const force = window.confirm('This order is blocked by rules. Override and execute anyway?');
          if (!force){ document.getElementById('orderResult').textContent = `Blocked by rules: ${preview.reasons.join(', ')}`; return; }
        }
        // 2) Place order
        const res = await fetch('/orders/market', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ts_et: ts, ticker, side, quantity, price, reason: 'manual-ui' })});
        const j = await res.json();
        document.getElementById('orderResult').textContent = JSON.stringify(j, null, 2);
        await refreshPortfolio();
      } catch(e){
        document.getElementById('orderResult').textContent = `Order error: ${e}`;
      } finally {
        _orderSubmitting = false;
        if (submitBtn) submitBtn.disabled = false;
      }
    }

    document.getElementById('refresh').onclick = refreshPortfolio;
    document.getElementById('submit').onclick = submitOrder;
    document.getElementById('load').onclick = async ()=>{ await loadBars(); };
    let lastDecisionId = null;
    function renderRecommendations(decisionId, proposals){
      lastDecisionId = decisionId;
      const container = document.getElementById('recs');
      container.innerHTML = '';
      const list = document.createElement('div');
      proposals.forEach((p, idx)=>{
        const row = document.createElement('div');
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.id = `rec_${idx}`; cb.dataset.idx = String(idx);
        const label = document.createElement('label');
        label.htmlFor = cb.id;
        const tSpan = document.createElement('span'); tSpan.className = 'rec-ticker'; tSpan.textContent = p.ticker;
        const aSpan = document.createElement('span'); aSpan.className = 'rec-action' + (String(p.action||'').toUpperCase()==='SELL'?' sell':''); aSpan.textContent = ` ${p.action}`;
        const qSpan = document.createElement('span'); qSpan.style.marginLeft = '6px'; qSpan.textContent = `qty=${p.quantity}`;
        label.appendChild(tSpan);
        label.appendChild(aSpan);
        label.appendChild(qSpan);
        if (p.thesis){ const th = document.createElement('span'); th.className='rec-thesis'; th.textContent = p.thesis; label.appendChild(th); }
        row.appendChild(cb);
        row.appendChild(label);
        list.appendChild(row);
      });
      container.appendChild(list);
      const execBtn = document.getElementById('execSelected');
      execBtn.disabled = proposals.length === 0;
    }

    document.getElementById('decide').onclick = async ()=>{
      try{
        const t = document.getElementById('ticker').value;
        const d = document.getElementById('end').value || new Date().toISOString().slice(0,10);
        const all = Array.isArray(window._universeTickers) ? window._universeTickers : [];
        const tickers = all.length ? all : [t];
        document.getElementById('status').textContent = `Requesting LLM recommendations for ${tickers.length} tickers (${d})...`;
        const r = await fetch('/decide/llm', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ tickers, date: d })});
        if(!r.ok){ throw new Error(await r.text()); }
        const j = await r.json();
        renderRecommendations(j.decision_id, j.proposals || []);
        document.getElementById('status').textContent = `Received ${ (j.proposals||[]).length } proposals (decision ${j.decision_id}).`;
      } catch(e){ document.getElementById('status').textContent = `LLM decide error: ${e}`; }
    };

    document.getElementById('execSelected').onclick = async ()=>{
      try{
        if(!lastDecisionId){ document.getElementById('status').textContent = 'No decision to execute.'; return; }
        const boxes = Array.from(document.querySelectorAll('#recs input[type="checkbox"]'));
        const selection = boxes.filter(b=>b.checked).map(b=> parseInt(b.dataset.idx));
        document.getElementById('status').textContent = `Executing ${selection.length} proposals for decision ${lastDecisionId}...`;
        const r = await fetch(`/decisions/${lastDecisionId}/execute`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ selection }) });
        const j = await r.json();
        document.getElementById('status').textContent = `Executed ${j.executed_count} proposals.`;
        await refreshPortfolio();
      } catch(e){ document.getElementById('status').textContent = `Execute error: ${e}`; }
    };
    // backtest removed

    document.getElementById('ticker').onchange = async ()=>{
      const t = document.getElementById('ticker').value;
      console.debug('[UI] ticker changed', t);
      document.getElementById('status').textContent = `Loading dates for ${t}...`;
      const r = await api(`/prices/available-dates/${t}`);
      const startEl = document.getElementById('start');
      const endEl = document.getElementById('end');
      if (r.dates && r.dates.length){
        const dates = r.dates;
        startEl.min = dates[0]; startEl.max = dates[dates.length-1];
        endEl.min = dates[0]; endEl.max = dates[dates.length-1];
        const n = Math.min(5, dates.length);
        startEl.value = dates[dates.length - n];
        endEl.value = dates[dates.length - 1];
        renderCoverage(dates, startEl.value, endEl.value);
      } else { renderCoverage([], '', ''); }
      await loadBars();
    };
    document.getElementById('start').onchange = async ()=>{ await loadBars(); };
    document.getElementById('end').onchange = async ()=>{ await loadBars(); };

    document.getElementById('orderTicker').onchange = updateLivePrice;

    loadUniverse().then(async ()=>{ document.getElementById('ticker').onchange(); }).then(refreshPortfolio);

    const es = new EventSource('/events');
    es.onmessage = (e)=>{
      const pre = document.getElementById('events');
      let suffix = '';
      try {
        let obj = JSON.parse(e.data);
        if (obj && (obj.source || obj.reason)) {
          const parts = [];
          if (obj.source) parts.push(`source=${obj.source}`);
          if (obj.reason) parts.push(`reason=${obj.reason}`);
          suffix = ' ' + parts.join(' ');
        }
      } catch {
        // try best-effort parse of python-dict
        try {
          const obj = JSON.parse(e.data.replace(/'/g, '"'));
          if (obj && (obj.source || obj.reason)) {
            const parts = [];
            if (obj.source) parts.push(`source=${obj.source}`);
            if (obj.reason) parts.push(`reason=${obj.reason}`);
            suffix = ' ' + parts.join(' ');
          }
        } catch {}
      }
      pre.textContent += e.data + suffix + '\n';
      pre.scrollTop = pre.scrollHeight;
    };
    
    function renderCoverage(dates, start, end){
      const el = document.getElementById('coverage');
      if(!dates || dates.length===0){ el.textContent = "No cached dates for this ticker."; return; }
      const beginIdx = Math.max(0, dates.indexOf(start));
      const endIdx = Math.max(beginIdx, dates.indexOf(end));
      const slice = dates.slice(beginIdx, endIdx+1);
      const txt = slice.map(d=> "|").join("") + "|";
      el.textContent = `Coverage ${start}..${end} (${slice.length} days): ${txt}`;
    }

    
  </script>
</body>
</html>
